# Rebuilds the map from the raw data on every push to main, then publishes it with GitHub Pages.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Build and publish the atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install the LP solver
        run: npm ci

      - name: Check raw data against recorded checksums
        run: python src/data_prep/fetch_raw.py --check-only

      - name: Run the pipeline (data prep, model, solver check, web page)
        run: python run_all.py

      - name: Keep the result tables as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            outputs/
            data/processed/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
